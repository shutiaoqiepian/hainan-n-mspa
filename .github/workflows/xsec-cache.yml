name: 更新大气剖面缓存

# 数据源：NOAA GFS 0.25° pgrb2（公有领域，无需 key）
#
# GFS 每天 4 次起报（UTC 00 / 06 / 12 / 18），起报后约 3.5–4.5 小时才出齐。
# 这里按「起报 + 4 小时」排，保证抓的是最新一轮，而且赶在海南日落前：
#
#   UTC 04:40（北京 12:40）← 00Z 起报  ★ 跑全国 224 机位
#   UTC 10:40（北京 18:40）← 06Z 起报  ★ 跑全国 224 机位（日落前最后一次，最有用）
#   UTC 16:40（北京 00:40）← 12Z 起报    只跑海南试点 8 机位
#   UTC 22:40（北京 06:40）← 18Z 起报    只跑海南试点 8 机位
#
# 为什么不是每轮都跑全国：全国一轮实测约 25 分钟（53 个带 × 4 时次下载），
# 每轮都跑会让任务时长和仓库体积都翻几倍。**每天两次**是 2026-11-04 定的口径：
# 挑北京 12:40 与 18:40 两个用户最活跃、且都赶在当天日落前的时次。
# 手动触发（workflow_dispatch）一律跑全国，方便随时补数据。
#
# 失败处理：build_cross.py 内建 filter → Range 双下载路径与重试；
# 任何一步失败都非零退出，**不会**生成半成品缓存，也就不会提交。
# 上一轮可用缓存保持不动（站点继续用旧数据，页面会显示数据年龄）。
on:
  schedule:
    # ★ 拆成两条表达式，不是为了好看：判断「这一轮跑全国还是仅试点」
    #   要靠 github.event.schedule（触发它的 cron 原文）。
    #   一条表达式里塞 4 个时次的话，四条触发的字符串完全一样，没法区分。
    #
    # ★★ 2026-11-04 踩的坑（务必看）：第一版用 `date -u +%H` 判断当前小时。
    #   GitHub 的 scheduled 任务**不保证准点**——实测预定 UTC 04:40 的那轮
    #   实际 05:32 才启动，晚了 52 分钟，跨过了整点 → 判断成「非全国轮」
    #   → 全国构建被 skip，又是白等一天。
    #   结论：**永远不要用运行时时钟去推断「这一轮本该是什么轮」**，
    #   要用 github.event.schedule。
    - cron: "40 4,10 * * *"   # 北京 12:40 / 18:40 → 跑全国 224 机位
    - cron: "40 16,22 * * *"  # 北京 00:40 / 06:40 → 只跑海南试点 8 机位
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsec-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 全国 224 机位构建实测约 25 分钟（53 个带 × 4 时次下载 + 224 × 4 剖面量化），
    # 加上依赖安装和校验，留 50 分钟余量。试点轮只需几分钟。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 GRIB2 解码依赖（eccodes）
        run: |
          python -m pip install --upgrade pip
          pip install eccodes numpy
          python -c "import eccodes, numpy; print('eccodes', eccodes.codes_get_api_version(), '| numpy', numpy.__version__)"

      # ---- 决定这一轮跑「全国 224 机位」还是「海南试点 8 机位」 ----
      #
      # 2026-11-04 之前这里**只跑试点**，导致全国 224 机位的数据
      # 从 2026-11-01 起冻结了 4 天（用户截图报「Open-Meteo 没有这一时刻的数据」
      # 就是因为它用了 4 天前的时刻去查只覆盖未来 3 天的接口）。
      #
      # 全国一轮约 25 分钟，所以不能每轮都跑。按主人定的「每天两次」：
      #   UTC 04:40（北京 12:40）← 00Z 起报 → 跑全国
      #   UTC 10:40（北京 18:40）← 06Z 起报 → 跑全国（日落前最后一轮，最有用）
      #   UTC 16:40（北京 00:40）← 12Z 起报 → 只跑试点
      #   UTC 22:40（北京 06:40）← 18Z 起报 → 只跑试点
      # 手动触发（workflow_dispatch）默认也跑全国，方便随时补。
      - name: 判断本轮跑全国还是仅试点
        id: mode
        run: |
          # 只看「是哪个 cron 触发的」，不看现在几点。
          # 定时任务可能延迟很久，用 date 判断会跨整点判错（2026-11-04 实测踩过）。
          SCHED='${{ github.event.schedule }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NATIONAL=1
            WHY="手动触发"
          elif [ "$SCHED" = "40 4,10 * * *" ]; then
            NATIONAL=1
            WHY="全国轮（cron $SCHED = 北京 12:40 / 18:40）"
          else
            NATIONAL=0
            WHY="试点轮（cron ${SCHED:-无} = 北京 00:40 / 06:40）"
          fi
          echo "national=$NATIONAL" >> "$GITHUB_OUTPUT"
          echo "触发来源：$WHY"
          if [ "$NATIONAL" = "1" ]; then
            echo "本轮：全国 224 机位（约 25 分钟）"
          else
            echo "本轮：海南试点 8 机位"
          fi

      - name: 构建剖面缓存（全国 224 机位）
        if: steps.mode.outputs.national == '1'
        run: python tools/xsec/build_cross_national.py

      - name: 构建剖面缓存（海南试点 8 机位）
        if: steps.mode.outputs.national != '1'
        run: python tools/xsec/build_cross.py

      # 试点那份永远要校验（它每天每轮都在更新）。
      # 全国那份用 quality_national.py：检查 224 个机位是否齐全、结构是否自洽。
      - name: 校验试点产物结构与物理量级
        run: python tools/xsec/verify_cross.py

      - name: 校验全国 224 机位完整性
        if: steps.mode.outputs.national == '1'
        run: python tools/xsec/quality_national.py

      # 环境上下文（真实 DEM 地形 + AOD）。数据源是 Open-Meteo 的两个接口，
      # 免费额度在同一出口 IP 上比较紧（实测约 10 次/分钟），所以：
      #   · 单独一个文件 data/cross/context.json，失败不影响 GFS 剖面缓存；
      #   · --allow-partial：单机位失败只记 errors[]，页面显示"缺测"。
      - name: 构建环境上下文（DEM 地形 + AOD，失败不阻塞 GFS 缓存）
        continue-on-error: true
        run: python tools/xsec/build_context.py --allow-partial

      - name: 打印本轮数据体积与阈值标定摘要
        run: |
          python - <<'PY'
          import json, pathlib
          q = json.loads(pathlib.Path('data/cross/quality.json').read_text(encoding='utf-8'))
          print('下载方式:', [d['how'] for d in q['downloads']])
          t = q['thresholds']
          print('标定样本:', t['samples'], '模式有云点:', t['modelCloudPoints'])
          for row in t['table']:
              print(f"  qt>={row['thKgKg']:.0e}  POD={row['pod']}  FAR={row['far']}  一致率={row['agreement']}")
          PY

      - name: 有变化才提交
        run: |
          git config user.name "18N-MSPA Bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/cross/)" ]; then
            git add data/cross/
            git commit -m "chore: update cross-section cache"
            git pull --rebase --autostash
            git push
          else
            echo "no change"
          fi

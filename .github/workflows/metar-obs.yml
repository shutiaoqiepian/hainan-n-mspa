name: 存档实况与预报快照（用于事后算误报率）

# 为什么要有这个：算法要改进就得知道「当时到底准不准」。
# 但没人愿意填反馈表单 —— 所以这里用的全是自动数据：
#   1) METAR：离机位 ≤60 km 的机场逐小时实况（云组 + 能见度），免费、无需 key
#   2) 预报快照：把当天各机位的分数存一份，因为 data/forecast/*.json 每 6 小时会被覆盖
#
# ★ 2026-10-25 起机位库里多了「XX机场观测点」（spots.json 里带 obs 字段的点）：
#   它们是机场本身，和 METAR 实况同一个坐标，所以快照里能拿到「同址配对」的 A 级样本。
#   A 级样本才是能用来改算法的口径；没有观测点的机场只能退到 B 级（就近代表）。
#   ⚠ spots.json 加减机位后必须重跑 tools/build-cache.mjs，否则缓存索引对不上。
#
# 两者按「日期 + 日落时刻」配对，第二天就能算出端到端误报率：
#   node tools/check-accuracy.mjs              # A/B 两级分开汇总
#   node tools/check-accuracy.mjs --only-a     # 只看同址配对
#
# 体积：每天约 15 KB（METAR 5 KB + 快照 10 KB），一年约 5 MB。
#
# ★ 2026-10-28 踩过的坑（别再踩）：
#   预报缓存每天 4 次，固定在 UTC 01:05 / 07:05 / 13:05 / 19:05。
#   本任务原来只在 UTC 12:00 跑，那时最新缓存还是 UTC 07 那次（北京时间 15:00 生成），
#   覆盖当天没问题；但 10-28 那天缓存停在 UTC 10-27 19:42，算出来的目标日期是 10-28，
#   文件名也写成 10-28，实际用的却是前一天晚上的数据 —— 快照「看起来有」但是错的，
#   那天 A 级样本直接丢了。
#   现在两道保险：
#     1) snapshot-forecast.mjs 校验「目标日期 == 北京时间今天」，对不上就跳过并 ::error::
#     2) 多一次 UTC 12:25 的补跑机会
on:
  schedule:
    # 北京时间 20:00（UTC 12:00），日落后 1.5 小时，当天日落观测已发报
    - cron: "0 12 * * *"
    # 北京时间 20:25（UTC 12:25）补跑：第一次因缓存过旧而跳过时兜底
    - cron: "25 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # snapshot-forecast.mjs 用 esbuild 打包 src/ 里的评分代码，
      # 这样算法只有一份，不会在这里被抄第二遍。
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 先检查「机位表 ↔ 省级缓存」是否对齐。
      # 不对齐时 compute() 会让新机位静默拿到 weather[0] 的数据，
      # 观测点就算进不了 A 级样本 —— 这一步就是为了不让它悄悄坏掉。
      - name: 检查机位表与缓存是否对齐
        run: |
          node -e '
          const fs = require("fs");
          const spots = JSON.parse(fs.readFileSync("src/data/forecast/spots.json", "utf8"));
          const list = Array.isArray(spots) ? spots : spots.spots;
          const byProv = {};
          for (const s of list) byProv[s.prov] = (byProv[s.prov] || 0) + 1;
          let bad = 0;
          for (const prov of Object.keys(byProv)) {
            const f = "data/forecast/" + prov + ".json";
            if (!fs.existsSync(f)) { console.log("缺缓存 " + prov); bad++; continue; }
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            if (j.spots !== byProv[prov]) { console.log("不对齐 " + prov + "：缓存 " + j.spots + "，机位表 " + byProv[prov]); bad++; }
          }
          if (bad) { console.log("::error::有 " + bad + " 个省的缓存与机位表数量不一致，先跑 node tools/build-cache.mjs"); process.exit(1); }
          console.log("机位表与 34 省缓存全部对齐");
          '

      - name: 抓 METAR 实况（最近 24 小时）
        run: node tools/fetch-metar.mjs --days 24

      - name: 存当天预报快照（所有有缓存的省份，约 34 份）
        run: node tools/snapshot-forecast.mjs
        continue-on-error: true

      # --save 会把 A/B 汇总写进 data/obs/accuracy/，
      # 这样趋势不依赖 Action 日志（日志 90 天就没了）。
      # 样本够且误报率偏高时会打 ::warning::，在 Actions 页面高亮，不发邮件。
      - name: 算误报率并存档（A 级 = 同址配对，主口径）
        run: node tools/check-accuracy.mjs --top 10 --save
        continue-on-error: true

      - name: 一句话现状（写进 run summary，手机上也能看）
        run: node tools/accuracy-trend.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # 数据缺口自检：2026-10-28 那天快照「看起来有、其实是旧数据」，
      # 7 天后才被发现。这一步让机器每天自己发现缺口，而不是等人翻历史。
      - name: 数据缺口自检
        run: node tools/check-gaps.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: 有变化才提交
        run: |
          git config user.name "yt437700"
          git config user.email "yt437700@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/obs/)" ]; then
            git add data/obs/
            git commit -m "chore: 存档 metar obs + 预报快照"
            git push
          else
            echo "no change"
          fi

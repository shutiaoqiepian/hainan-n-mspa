<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面不存在 · 北纬18度椰青摄联</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#101113" />
<link rel="icon" href="images/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
<script>
  /* 首帧前定主题，避免刷新白闪。逻辑与 src/lib/theme.ts 保持一致；
     ?theme=dark|gray|light 可临时预览（不写回 localStorage）。 */
  (function () {
    var t = 'dark';
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'dark' || q === 'gray' || q === 'light') t = q;
      else {
        var s = localStorage.getItem('mspa:theme');
        if (s === 'dark' || s === 'gray' || s === 'light') t = s;
      }
    } catch (e) { /* 隐私模式等，退回默认黑 */ }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div id="app">
  <noscript><p class="muted" style="padding:48px 24px;text-align:center">本站需要浏览器启用 JavaScript 才能显示内容。</p></noscript>
</div>

<script type="module" src="/src/entries/not-found.ts"></script>

</body>
</html>

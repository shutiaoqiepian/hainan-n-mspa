<!-- 首屏第一张图先抢一个请求位：页面要靠 JS 挂载才出 <img>，不 preload 的话
     这张图要等 JS 下载 + 执行完（国内约 3s）才开始下。 -->
<link
  rel="preload"
  as="image"
  type="image/webp"
  href="%VITE_SITE_ORIGIN%/images/thumbs-400-webp/hai.webp"
  imagesrcset="%VITE_SITE_ORIGIN%/images/thumbs-400-webp/hai.webp 400w, %VITE_SITE_ORIGIN%/images/thumbs-webp/hai.webp 800w"
  imagesizes="(max-width: 1000px) 46vw, 32vw"
/>
<script>
  /* 首帧前定主题，避免刷新白闪。逻辑与 src/lib/theme.ts 保持一致；
     ?theme=dark|gray|light 可临时预览（不写回 localStorage）。 */
  (function () {
    var t = 'dark';
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'dark' || q === 'gray' || q === 'light') t = q;
      else {
        var s = localStorage.getItem('mspa:theme');
        if (s === 'dark' || s === 'gray' || s === 'light') t = s;
      }
    } catch (e) { /* 隐私模式等，退回默认黑 */ }
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f1f2f4' : (t === 'gray' ? '#26292d' : '#0c0d0f'));
    /* 性能模式同理：首帧前设好，否则会先铺满毛玻璃再变朴素，闪一下。
       逻辑与 src/lib/perf.ts 保持一致；?perf=on|off 可临时预览。 */
    try {
      var p = new URLSearchParams(location.search).get('perf');
      if (p !== 'on' && p !== 'off') p = localStorage.getItem('mspa:perf');
      if (p === 'on') document.documentElement.setAttribute('data-perf', 'on');
    } catch (e) { /* 隐私模式等，退回标准模式 */ }
  })();
</script>
